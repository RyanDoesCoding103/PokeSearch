<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéSearch Explorer | Lesson 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-primary: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a5b4fc, #6366f1, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    /* Search Box */
    .search-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin-bottom: 2rem;
    }

    .search-form {
      display: flex;
      gap: 0.75rem;
    }

    .search-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 0.85rem;
      padding: 0.9rem 1.2rem;
      color: #fff;
      font-size: 1.05rem;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .search-btn {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 0.85rem;
      padding: 0.9rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    .quick-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
      align-items: center;
    }

    .pill-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-right: 0.25rem;
    }

    .pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 0.35rem 0.85rem;
      font-size: 0.85rem;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent-primary);
      color: #fff;
    }

    /* Result Card */
    .result-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 1.5rem;
      padding: 2.5rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      display: none;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 1.5rem;
    }

    .pokemon-id {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.15);
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
    }

    .pokemon-title {
      font-size: 2.5rem;
      font-weight: 800;
      text-transform: capitalize;
      letter-spacing: -0.5px;
    }

    .types-container {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.5rem;
    }

    .type-badge {
      text-transform: uppercase;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    /* Sound Control Buttons */
    .cries-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1rem;
      align-items: center;
    }

    .sound-btn {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(99, 102, 241, 0.2));
      border: 1px solid rgba(236, 72, 153, 0.4);
      color: #f472b6;
      border-radius: 12px;
      padding: 0.6rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.25s ease;
    }

    .sound-btn:hover {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.35), rgba(99, 102, 241, 0.35));
      border-color: #ec4899;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(236, 72, 153, 0.3);
    }

    .sound-btn.playing {
      animation: pulseGlow 1s infinite alternate;
      border-color: #10b981;
      color: #6ee7b7;
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 5px rgba(16, 185, 129, 0.4); }
      to { box-shadow: 0 0 20px rgba(16, 185, 129, 0.8); }
    }

    /* Grid Layout */
    .card-body {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 2rem;
    }

    @media (max-width: 680px) {
      .card-body {
        grid-template-columns: 1fr;
      }
    }

    .pokemon-art-wrapper {
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
      border-radius: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .pokemon-art {
      width: 100%;
      max-width: 220px;
      height: auto;
      filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.5));
      transition: transform 0.3s ease;
    }

    .pokemon-art:hover {
      transform: scale(1.06);
    }

    .meta-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      width: 100%;
      margin-top: 1.25rem;
    }

    .metric-box {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 0.75rem;
      padding: 0.75rem;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .metric-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* Section Styling */
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
    }

    .abilities-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.75rem;
    }

    .ability-chip {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 0.5rem 0.9rem;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-transform: capitalize;
    }

    .hidden-badge {
      background: #ec4899;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    /* Stat Bars */
    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 120px 40px 1fr;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.85rem;
    }

    .stat-name {
      color: var(--text-muted);
      text-transform: capitalize;
      font-weight: 500;
    }

    .stat-val {
      font-weight: 700;
      text-align: right;
    }

    .bar-bg {
      background: rgba(255, 255, 255, 0.08);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #6366f1, #3b82f6);
      transition: width 0.6s ease-out;
    }

    /* Loader & Error */
    .loader-box {
      display: none;
      text-align: center;
      padding: 3rem;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-box {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 1.25rem 1.5rem;
      border-radius: 1rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* Type Colors */
    .type-fire { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .type-water { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .type-grass { background: linear-gradient(135deg, #10b981, #059669); }
    .type-electric { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .type-psychic { background: linear-gradient(135deg, #ec4899, #db2777); }
    .type-ice { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .type-dragon { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
    .type-dark { background: linear-gradient(135deg, #475569, #334155); }
    .type-fairy { background: linear-gradient(135deg, #f472b6, #e11d48); }
    .type-normal { background: linear-gradient(135deg, #94a3b8, #64748b); }
    .type-fighting { background: linear-gradient(135deg, #ea580c, #c2410c); }
    .type-flying { background: linear-gradient(135deg, #818cf8, #6366f1); }
    .type-poison { background: linear-gradient(135deg, #a855f7, #9333ea); }
    .type-ground { background: linear-gradient(135deg, #d97706, #b45309); }
    .type-rock { background: linear-gradient(135deg, #78716c, #57534e); }
    .type-bug { background: linear-gradient(135deg, #84cc16, #65a30d); }
    .type-ghost { background: linear-gradient(135deg, #6b21a8, #581c87); }
    .type-steel { background: linear-gradient(135deg, #64748b, #475569); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">
        <span>⚡ PokéSearch Explorer</span>
      </div>
      <p class="tagline">Lesson 2 — Go Backend + PokéAPI Integration with Sound FX</p>
    </header>

    <div class="search-card">
      <form class="search-form" id="searchForm">
        <input 
          type="text" 
          id="pokemonInput" 
          class="search-input" 
          placeholder="Enter Pokémon name or ID (e.g. Pikachu, Dracovish, 25)..." 
          required 
          autocomplete="off"
        />
        <button type="submit" class="search-btn">
          <span>Search</span>
        </button>
      </form>

      <div class="quick-pills">
        <span class="pill-label">Try searching:</span>
        <button class="pill" onclick="searchPokemon('pikachu')">Pikachu</button>
        <button class="pill" onclick="searchPokemon('dracovish')">Dracovish</button>
        <button class="pill" onclick="searchPokemon('mewtwo')">Mewtwo</button>
        <button class="pill" onclick="searchPokemon('charizard')">Charizard</button>
        <button class="pill" onclick="searchPokemon('gyarados')">Gyarados</button>
        <button class="pill" onclick="searchPokemon('gengar')">Gengar</button>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="loader-box" id="loaderBox">
      <div class="spinner"></div>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Fetching data from Go backend...</p>
    </div>

    <div class="result-card" id="resultCard">
      <div class="card-header">
        <div>
          <span class="pokemon-id" id="pokemonId">#000</span>
          <h1 class="pokemon-title" id="pokemonName">Pokemon Name</h1>
          <div class="types-container" id="typesContainer"></div>
        </div>
        <div class="cries-container" id="criesContainer"></div>
      </div>

      <div class="card-body">
        <div class="pokemon-art-wrapper">
          <img id="pokemonArt" class="pokemon-art" src="" alt="Pokemon Art" />
          <div class="meta-metrics">
            <div class="metric-box">
              <div class="metric-value" id="baseExp">-</div>
              <div class="metric-label">Base Exp</div>
            </div>
            <div class="metric-box">
              <div class="metric-value" id="pokemonHeight">-</div>
              <div class="metric-label">Height</div>
            </div>
            <div class="metric-box">
              <div class="metric-value" id="pokemonWeight">-</div>
              <div class="metric-label">Weight</div>
            </div>
          </div>
        </div>

        <div>
          <div class="section-title">Abilities</div>
          <div class="abilities-list" id="abilitiesList"></div>

          <div class="section-title">Stats</div>
          <div class="stats-container" id="statsContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const searchForm = document.getElementById('searchForm');
    const pokemonInput = document.getElementById('pokemonInput');
    const resultCard = document.getElementById('resultCard');
    const loaderBox = document.getElementById('loaderBox');
    const errorBox = document.getElementById('errorBox');
    let currentAudio = null;

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = pokemonInput.value.trim();
      if (val) searchPokemon(val);
    });

    async function searchPokemon(name) {
      pokemonInput.value = name;
      showLoader();
      stopAudio();

      try {
        const res = await fetch(`/api/pokemon?name=${encodeURIComponent(name.toLowerCase())}`);
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || `Error fetching Pokémon (Status ${res.status})`);
          return;
        }

        renderPokemon(data);
      } catch (err) {
        showError('Network error. Could not connect to Go backend.');
      }
    }

    function playCry(url, btnElement) {
      stopAudio();
      if (!url) return;

      currentAudio = new Audio(url);
      if (btnElement) btnElement.classList.add('playing');

      currentAudio.play().catch(err => {
        console.warn('Audio play error:', err);
      });

      currentAudio.onended = () => {
        if (btnElement) btnElement.classList.remove('playing');
      };
    }

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      document.querySelectorAll('.sound-btn').forEach(btn => btn.classList.remove('playing'));
    }

    function renderPokemon(p) {
      hideLoader();

      document.getElementById('pokemonId').textContent = `#${String(p.id).padStart(3, '0')}`;
      document.getElementById('pokemonName').textContent = p.name;
      document.getElementById('baseExp').textContent = p.base_experience || 'N/A';
      document.getElementById('pokemonHeight').textContent = `${(p.height / 10).toFixed(1)}m`;
      document.getElementById('pokemonWeight').textContent = `${(p.weight / 10).toFixed(1)}kg`;

      // Artwork image
      const artUrl = p.sprites?.other?.['official-artwork']?.front_default || p.sprites?.front_default || '';
      const artEl = document.getElementById('pokemonArt');
      artEl.src = artUrl;
      artEl.alt = p.name;

      // Types
      const typesContainer = document.getElementById('typesContainer');
      typesContainer.innerHTML = p.types.map(t => {
        const typeName = t.type.name;
        return `<span class="type-badge type-${typeName}">${typeName}</span>`;
      }).join('');

      // Cries sound buttons
      const criesContainer = document.getElementById('criesContainer');
      let soundButtonsHTML = '';
      if (p.cries?.latest) {
        soundButtonsHTML += `
          <button class="sound-btn" onclick="playCry('${p.cries.latest}', this)">
            🔊 Play Cry (Latest)
          </button>
        `;
      }
      if (p.cries?.legacy) {
        soundButtonsHTML += `
          <button class="sound-btn" onclick="playCry('${p.cries.legacy}', this)">
            📻 Play Cry (Legacy)
          </button>
        `;
      }
      criesContainer.innerHTML = soundButtonsHTML;

      // Abilities
      const abilitiesList = document.getElementById('abilitiesList');
      abilitiesList.innerHTML = p.abilities.map(a => `
        <div class="ability-chip">
          <span>${a.ability.name.replace('-', ' ')}</span>
          ${a.is_hidden ? '<span class="hidden-badge">Hidden</span>' : ''}
        </div>
      `).join('');

      // Stats
      const statsContainer = document.getElementById('statsContainer');
      statsContainer.innerHTML = p.stats.map(s => {
        const statNameMap = {
          'hp': 'HP',
          'attack': 'Attack',
          'defense': 'Defense',
          'special-attack': 'Sp. Atk',
          'special-defense': 'Sp. Def',
          'speed': 'Speed'
        };
        const displayName = statNameMap[s.stat.name] || s.stat.name;
        const pct = Math.min(100, Math.round((s.base_stat / 180) * 100));

        return `
          <div class="stat-row">
            <span class="stat-name">${displayName}</span>
            <span class="stat-val">${s.base_stat}</span>
            <div class="bar-bg">
              <div class="bar-fill" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      resultCard.style.display = 'block';
    }

    function showLoader() {
      resultCard.style.display = 'none';
      errorBox.style.display = 'none';
      loaderBox.style.display = 'block';
    }

    function hideLoader() {
      loaderBox.style.display = 'none';
    }

    function showError(msg) {
      hideLoader();
      resultCard.style.display = 'none';
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    // Default initial search
    searchPokemon('dracovish');
  </script>
</body>
</html>
